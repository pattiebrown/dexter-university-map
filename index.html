<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dexter's University Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0}
body{font-family:Arial,Helvetica,sans-serif}
.map-title{
  position:absolute;z-index:1000;top:12px;left:50%;transform:translateX(-50%);
  background:rgba(255,255,255,.94);padding:8px 14px;border-radius:8px;
  box-shadow:0 1px 6px rgba(0,0,0,.25);font-weight:700;font-size:16px;
}
.uni-label{
  background:rgba(255,255,255,.88);border:1px solid #666;border-radius:4px;
  padding:3px 6px;font-size:11px;line-height:1.2;white-space:nowrap;
  box-shadow:0 1px 3px rgba(0,0,0,.15)
}
.leaflet-tooltip.uni-label:before{display:none}
</style>
</head>
<body>
<div class="map-title">Dexter's University Options</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const universities = [
  ["Lakehead University","Thunder Bay","Ontario",48.4220,-89.2609],
  ["Ontario Tech University","Oshawa","Ontario",43.9454,-78.8965],
  ["University of Windsor","Windsor","Ontario",42.3043,-83.0660],
  ["University of Toronto","Toronto","Ontario",43.6629,-79.3957],
  ["Queen's University","Kingston","Ontario",44.2253,-76.4951],
  ["Memorial University","St. John's","Newfoundland and Labrador",47.5729,-52.7330],
  ["UNB Saint John","Saint John","New Brunswick",45.2733,-66.0633],
  ["University of Alberta","Edmonton","Alberta",53.5232,-113.5263],
  ["Simon Fraser University","Surrey","British Columbia",49.1870,-122.8490],
  ["UNB Fredericton","Fredericton","New Brunswick",45.9450,-66.6413],
  ["Old Dominion University","Norfolk","Virginia",36.8854,-76.3050]
];
const map = L.map("map", {zoomControl:true});
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom:19,
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

const bounds = [];
universities.forEach(([name,city,province,lat,lng]) => {
  const marker = L.marker([lat,lng]).addTo(map);
  marker.bindPopup("<strong>"+name+"</strong><br>"+city+", "+province);
  marker.bindTooltip(
    "<strong>"+name+"</strong><br>"+city+", "+province,
    {permanent:true,direction:"right",offset:[8,0],className:"uni-label"}
  );
  bounds.push([lat,lng]);
});
map.fitBounds(bounds,{padding:[35,35]});
</script>
</body>
</html>
