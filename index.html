<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dexter's University Map</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
html,body{height:100%;margin:0;font-family:Arial,sans-serif}body{display:flex;background:#f6f8fb;color:#1f2937}#side{width:360px;max-width:42vw;overflow:auto;background:white;border-right:1px solid #d1d5db;padding:16px;box-sizing:border-box}#map{flex:1;min-height:100vh}h1{font-size:22px;margin:0 0 8px}.sub,.note{font-size:12px;color:#4b5563;line-height:1.4}.sec{margin-top:16px;font-size:13px;font-weight:700;color:#0f766e;text-transform:uppercase}.filters select{width:100%;margin:6px 0;padding:7px}.filters label{display:flex;gap:8px;margin:8px 0;font-size:13px}.legend{font-size:12px;line-height:1.8}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}.card{border:1px solid #e5e7eb;border-radius:9px;padding:9px 10px;margin:8px 0;background:#fafafa;cursor:pointer}.card:hover{background:#f0fdf4}.card b{font-size:14px}.mini{font-size:12px;color:#4b5563}.badge{display:inline-block;margin-top:5px;padding:2px 7px;border-radius:12px;background:#e5e7eb;font-size:11px;font-weight:700}.lbl{background:rgba(255,255,255,.9);border:1px solid #6b7280;border-radius:4px;padding:3px 6px;font-size:11px;white-space:nowrap}.leaflet-tooltip.lbl:before{display:none}.popup{font-size:12px;line-height:1.35}.grid{display:grid;grid-template-columns:100px 1fr;gap:5px 8px}.links{margin-top:9px;display:flex;gap:6px}.links a{background:#0f766e;color:#fff;padding:5px 8px;border-radius:6px;text-decoration:none;font-weight:700}.links a:last-child{background:#334155}@media(max-width:900px){body{display:block}#side{width:100%;max-width:none;max-height:46vh;border-right:0;border-bottom:1px solid #ddd}#map{min-height:54vh}}
</style></head><body><div id="side"><h1>Dexter's University Map</h1><div class="sub">Compare the universities on Dexter's spreadsheet by program path, admissions category, city/campus size, co-op and ski access.</div><div class="sec">Filters</div><div class="filters">
<select id="country"><option value="all">All countries</option><option>Canada</option><option>United States</option></select>
<select id="rating"><option value="all">All admissions categories</option><option value="likely">Likely / Safety</option><option value="target">Target</option><option value="reach">Reach</option><option value="veryreach">Very High Reach</option></select>
<label><input type="checkbox" id="direct">Direct-entry mechatronics only</label><label><input type="checkbox" id="common">Common-first-year routes only</label><label><input type="checkbox" id="option">Option / focus / transfer routes only</label><label><input type="checkbox" id="ski">Skiing within about 1 hour</label><label><input type="checkbox" id="coop">Co-op / internship highlighted</label><label><input type="checkbox" id="labels" checked>Show map labels</label></div>
<div class="sec">Admissions legend</div><div class="legend"><div><span class="dot" style="background:#22c55e"></span>Likely / Safety</div><div><span class="dot" style="background:#3b82f6"></span>Target</div><div><span class="dot" style="background:#f59e0b"></span>Reach</div><div><span class="dot" style="background:#ef4444"></span>Very High Reach</div></div><div id="count" style="margin:12px 0 4px;font-weight:700;font-size:13px"></div><div id="list"></div><p class="note">City/campus size and ski distances are approximate planning labels.</p></div><div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const S=[{"name":"Lakehead University","city":"Thunder Bay","province":"Ontario","country":"Canada","lat":48.422,"lng":-89.2609,"rating":"Safety / Likely","ratingKey":"likely","program":"BEng Mechatronics Engineering","structure":"Direct-entry mechatronics","programType":"direct","coop":"Integrated co-op available","coopKey":"coop","citySize":"Small","campusSize":"Small","students":"~8,500 students","skiHill":"Loch Lomond Ski Area","skiDrive":"~20 min / ~20 km","skiMinutes":20,"apply":"https://www.ouac.on.ca/apply/dashboard/en_CA/user/login","website":"https://www.lakeheadu.ca/programs/undergraduate-programs/engineering-mechatronics","notes":"Good lower-risk direct-entry mechatronics option. Lakehead also has strong diploma-to-degree pathways."},{"name":"Ontario Tech University","city":"Oshawa","province":"Ontario","country":"Canada","lat":43.9454,"lng":-78.8965,"rating":"Likely / Target","ratingKey":"target","program":"BEng Mechatronics Engineering","structure":"Direct-entry mechatronics","programType":"direct","coop":"Paid co-op available","coopKey":"coop","citySize":"Medium","campusSize":"Small","students":"~11,000 students","skiHill":"Brimacombe","skiDrive":"~35 min / ~35 km","skiMinutes":35,"apply":"https://www.ouac.on.ca/apply/dashboard/en_CA/user/login","website":"https://ontariotechu.ca/programs/undergraduate/engineering/mechatronics-engineering/","notes":"Strong practical option: direct Mechatronics, co-op, and more attainable admissions than the highest-reach schools."},{"name":"University of Windsor","city":"Windsor","province":"Ontario","country":"Canada","lat":42.3043,"lng":-83.066,"rating":"Target","ratingKey":"target","program":"BASc Mechatronic Systems Engineering","structure":"Direct-entry mechatronics systems engineering","programType":"direct","coop":"Co-op opportunity","coopKey":"coop","citySize":"Medium","campusSize":"Medium","students":"~16,000 students","skiHill":"Pine Knob / Mount Holly area (Michigan)","skiDrive":"~1 hr 25 min + border / ~95–120 km","skiMinutes":85,"apply":"https://www.ouac.on.ca/apply/dashboard/en_CA/user/login","website":"https://www.future.uwindsor.ca/program/mechatronics-system-engineering/","notes":"Direct mechatronics degree with Autonomous Vehicles and Intelligent Manufacturing specializations."},{"name":"University of Toronto","city":"Toronto","province":"Ontario","country":"Canada","lat":43.6629,"lng":-79.3957,"rating":"Very High Reach","ratingKey":"veryreach","program":"Mechanical Engineering → Mechatronics Area of Focus","structure":"Mechanical engineering first, then mechatronics focus","programType":"option","coop":"PEY Co-op / experiential options","coopKey":"coop","citySize":"Large","campusSize":"Large","students":"~97,000 students","skiHill":"Earl Bales Ski & Snowboard Centre","skiDrive":"~25 min / ~15 km","skiMinutes":25,"apply":"https://www.ouac.on.ca/apply/dashboard/en_CA/user/login","website":"https://discover.engineering.utoronto.ca/programs/engineering-programs/mechanical-engineering/","notes":"Best U of T fit for Dexter’s current mechatronics interest is Mechanical Engineering with the Mechatronics Area of Focus."},{"name":"Queen's University","city":"Kingston","province":"Ontario","country":"Canada","lat":44.2253,"lng":-76.4951,"rating":"Very High Reach","ratingKey":"veryreach","program":"BASc Mechatronics & Robotics Engineering","structure":"Direct-entry mechatronics & robotics","programType":"direct","coop":"Internship option","coopKey":"internship","citySize":"Small","campusSize":"Large","students":"~31,000 students","skiHill":"Batawa Ski Hill","skiDrive":"~70 min / ~102 km","skiMinutes":70,"apply":"https://www.ouac.on.ca/apply/dashboard/en_CA/user/login","website":"https://www.queensu.ca/admission/study-engineering","notes":"Excellent direct-entry fit on paper, but still a major admissions reach."},{"name":"Memorial University","city":"St. John's","province":"Newfoundland and Labrador","country":"Canada","lat":47.5729,"lng":-52.733,"rating":"Target / Reach","ratingKey":"reach","program":"Engineering One → BEng Mechatronics Engineering","structure":"Common first year (Engineering One), then Mechatronics","programType":"common","coop":"Mandatory co-op / work terms","coopKey":"coop","citySize":"Small","campusSize":"Medium","students":"~18,000 students","skiHill":"White Hills Resort","skiDrive":"~2 hr / ~185 km","skiMinutes":120,"apply":"https://apply.mun.ca/","website":"https://www.mun.ca/undergrad/programs/engineering/mechatronics-engineering/","notes":"Very interesting Mechatronics program with strong work experience, but skiing is far away."},{"name":"UNB Saint John","city":"Saint John","province":"New Brunswick","country":"Canada","lat":45.2733,"lng":-66.0633,"rating":"Target","ratingKey":"target","program":"Years 1–2 at Saint John → Fredericton → Mechanical / Mechatronics option","structure":"Start at UNBSJ, then transfer to Fredericton","programType":"transfer","coop":"Varies by later Fredericton path","coopKey":"varies","citySize":"Small","campusSize":"Small","students":"~2,500 students","skiHill":"Poley Mountain","skiDrive":"~1 hr 10 min / ~100 km","skiMinutes":70,"apply":"https://unbca.elluciancrmrecruit.com/Apply/Account/Login?ReturnUrl=/Apply","website":"https://www.unb.ca/academics/programs/engineering/mechanical_sj.html","notes":"Good smaller-campus start, but the actual mechatronics specialization is completed in Fredericton."},{"name":"University of Alberta","city":"Edmonton","province":"Alberta","country":"Canada","lat":53.5232,"lng":-113.5263,"rating":"Reach / Target","ratingKey":"reach","program":"Common Engineering Year 1 → Mechatronics & Robotics Engineering Co-op","structure":"Common first year, then placement into Mechatronics & Robotics","programType":"common","coop":"Co-op only program","coopKey":"coop","citySize":"Large","campusSize":"Large","students":"~44,000 students","skiHill":"Rabbit Hill / Snow Valley","skiDrive":"~30 min / ~25 km","skiMinutes":30,"apply":"https://www.applyalberta.ca/","website":"https://www.ualberta.ca/en/engineering/programs/undergraduate/explore-programs/bsc-in-mechatronics-robotics-engineering.html","notes":"Very strong technical option; despite Robotics in the title, it is highly relevant to mechatronics."},{"name":"Simon Fraser University","city":"Surrey","province":"British Columbia","country":"Canada","lat":49.187,"lng":-122.849,"rating":"Reach","ratingKey":"reach","program":"BASc Mechatronic Systems Engineering","structure":"Direct-entry mechatronics systems engineering","programType":"direct","coop":"Mandatory co-op","coopKey":"coop","citySize":"Large","campusSize":"Large","students":"~37,000 students","skiHill":"Grouse Mountain / Cypress Mountain","skiDrive":"~45–50 min / ~35–45 km","skiMinutes":50,"apply":"https://apply.educationplannerbc.ca/sfu.jsp","website":"https://www.sfu.ca/students/admission/programs/a-z/m/mechatronic-systemseng/overview.html","notes":"Established western-Canada mechatronics choice with strong co-op and Vancouver-area opportunities."},{"name":"UNB Fredericton","city":"Fredericton","province":"New Brunswick","country":"Canada","lat":45.945,"lng":-66.6413,"rating":"Target","ratingKey":"target","program":"Common Engineering Year 1 → Mechanical Engineering → Mechatronics option","structure":"Common first year, then Mechanical with Mechatronics option","programType":"option","coop":"Work-term / experiential opportunities","coopKey":"varies","citySize":"Small","campusSize":"Small","students":"~8,000 students","skiHill":"Crabbe Mountain","skiDrive":"~45 min / ~55 km","skiMinutes":45,"apply":"https://unbca.elluciancrmrecruit.com/Apply/Account/Login?ReturnUrl=/Apply","website":"https://www.unb.ca/fredericton/engineering/depts/mechanical/undergrad.html","notes":"Compelling overall fit combining admissions, engineering path, student life and ski access."},{"name":"Old Dominion University","city":"Norfolk","province":"Virginia","country":"United States","lat":36.8854,"lng":-76.305,"rating":"Target","ratingKey":"target","program":"Engineering Fundamentals → Mechanical Engineering or Mechanical Engineering Technology with mechatronics systems coursework","structure":"Closest route rather than a standalone Mechatronics degree","programType":"option","coop":"Internships / experiential opportunities","coopKey":"varies","citySize":"Medium","campusSize":"Medium","students":"~23,000 students","skiHill":"Wintergreen Resort","skiDrive":"~3.5 hr / ~330 km","skiMinutes":210,"apply":"https://monarch.odu.edu/app/s/login/","website":"https://www.odu.edu/academics/programs/undergraduate/mechanical-engineering","notes":"Convenient geographically, but not as strong a pure Mechatronics match as the Canadian options."}],C={likely:'#22c55e',target:'#3b82f6',reach:'#f59e0b',veryreach:'#ef4444'},map=L.map('map'),layer=L.layerGroup().addTo(map);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);let active=[];
function popup(s){return '<div class="popup"><h3>'+s.name+'</h3><div><b>'+s.city+', '+s.province+'</b></div><div class="grid"><b>Program</b><div>'+s.program+'</div><b>Path</b><div>'+s.structure+'</div><b>Admissions</b><div>'+s.rating+'</div><b>City size</b><div>'+s.citySize+'</div><b>Campus</b><div>'+s.campusSize+' ('+s.students+')</div><b>Co-op</b><div>'+s.coop+'</div><b>Ski hill</b><div>'+s.skiHill+'</div><b>Ski access</b><div>'+s.skiDrive+'</div><b>Notes</b><div>'+s.notes+'</div></div><div class="links"><a target="_blank" href="'+s.website+'">Program Page</a><a target="_blank" href="'+s.apply+'">Apply</a></div></div>'}
function filt(){let c=country.value,r=rating.value,d=direct.checked,cm=common.checked,o=option.checked,sk=ski.checked,co=coop.checked;return S.filter(s=>(c==='all'||s.country===c)&&(r==='all'||s.ratingKey===r)&&(!d||s.programType==='direct')&&(!cm||s.programType==='common')&&(!o||['option','transfer'].includes(s.programType))&&(!sk||s.skiMinutes<=60)&&(!co||['coop','internship'].includes(s.coopKey)))}
function draw(){let v=filt(),b=[];layer.clearLayers();active=[];list.innerHTML=v.map(s=>'<div class="card" data-n="'+s.name+'"><b>'+s.name+'</b><div class="mini">'+s.city+', '+s.province+'</div><div class="mini">'+s.program+'</div><div class="mini">Skiing: '+s.skiDrive+'</div><span class="badge">'+s.rating+'</span></div>').join('');count.textContent=v.length+' school'+(v.length===1?'':'s')+' visible';v.forEach(s=>{let m=L.circleMarker([s.lat,s.lng],{radius:8,color:C[s.ratingKey],weight:2,fillColor:C[s.ratingKey],fillOpacity:.85}).addTo(layer).bindPopup(popup(s));if(labels.checked)m.bindTooltip('<b>'+s.name+'</b><br>'+s.city+', '+s.province,{permanent:true,direction:'top',offset:[0,-8],className:'lbl'});active.push({s,m});b.push([s.lat,s.lng])});if(b.length)map.fitBounds(b,{padding:[35,35]});else map.setView([46,-85],4);document.querySelectorAll('.card').forEach(x=>x.onclick=()=>{let a=active.find(z=>z.s.name===x.dataset.n);if(a){map.setView([a.s.lat,a.s.lng],Math.max(map.getZoom(),6));a.m.openPopup()}})}
['country','rating','direct','common','option','ski','coop','labels'].forEach(id=>document.getElementById(id).onchange=draw);draw();
</script></body></html>
